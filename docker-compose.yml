services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: reelforge
      POSTGRES_DB: reelforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge -d reelforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server"]
    ports:
      - "9000:3900"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # garage CLI reads rpc_secret from /etc/garage.toml; `status` is 0 when the server answers RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage-init:
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    network_mode: service:garage
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta:ro
    environment:
      GARAGE_RPC_SECRET: 7b086825f21e47b2f9922726ddc46b994372999a70c8953d6a1ed0c449e46261
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: reelforge-dev-secret-key
      S3_BUCKET: reelforge
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://reelforge:reelforge@db:5432/reelforge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: reelforge
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: reelforge-dev-secret-key
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app:ro
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-cpu:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://reelforge:reelforge@db:5432/reelforge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: reelforge
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: reelforge-dev-secret-key
      S3_REGION: us-east-1
    volumes:
      - ./app:/srv/app:ro
    command: uv run arq app.workers.main.WorkerSettings

volumes:
  pgdata:
  garagemeta:
  garagedata:
