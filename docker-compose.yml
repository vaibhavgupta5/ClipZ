services:
  mongo:
    image: mongo:8.0
    ports:
      - "27018:27017"  # host 27017 is often taken by another local mongo
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"  # bind-mounted data dirs stay owned by you
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: reelforge
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /srv/data/upload
      WORK_DIR: /srv/data/work
      EDITED_DIR: /srv/data/editedVideo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSETS_DIR: /srv/assets
      UV_CACHE_DIR: /tmp/uv
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app:ro
      - ./assets:/srv/assets:ro
      - ./upload:/srv/data/upload
      - ./work:/srv/data/work
      - ./editedVideo:/srv/data/editedVideo
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-cpu:
    build: .
    user: "${UID:-1000}:${GID:-1000}"  # bind-mounted data dirs stay owned by you
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: reelforge
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /srv/data/upload
      WORK_DIR: /srv/data/work
      EDITED_DIR: /srv/data/editedVideo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSETS_DIR: /srv/assets
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_HOME: /srv/data/work/.hf  # faster-whisper model, downloaded once
      UV_CACHE_DIR: /tmp/uv
    volumes:
      - ./app:/srv/app:ro
      - ./assets:/srv/assets:ro
      - ./upload:/srv/data/upload
      - ./work:/srv/data/work
      - ./editedVideo:/srv/data/editedVideo
    command: uv run --no-sync arq app.workers.main.WorkerSettings

volumes:
  mongodata:
