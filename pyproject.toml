[project]
name = "reelforge"
version = "0.1.0"
description = "ReelForge: agentic reel-editing backend (LLM edits Timeline JSON, deterministic FFmpeg renderer)"
readme = "CLAUDE.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5.0",
  "boto3>=1.34",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=2.5.3",
  "sse-starlette>=3.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "respx>=0.22",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.5",
  "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
  "integration: tests requiring live infra (postgres, redis, minio) or real providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S108"]
# Integration tests invoke fixed ffmpeg/ffprobe arg lists (never shell, no variables in argv[0]).
"tests/integration/test_ingest.py" = ["S603", "S607"]
# Vetted subprocess modules: arg lists only, never shell (enforced by tests/unit/test_no_shell.py).
"app/media/ffmpeg.py" = ["S603", "S607"]
"app/media/probe.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = ["arq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
